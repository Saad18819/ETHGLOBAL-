<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/>
    </marker>
    <marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <rect width="1200" height="780" fill="#ffffff"/>
  <text x="40" y="44" font-size="24" font-weight="700" fill="#0f172a">andthen: move to Arc, and then finish the job</text>
  <text x="40" y="70" font-size="14" fill="#475569">CCTP moves the money, CCIP moves the intent and the receipt, Arc runs the "and then"</text>

  <!-- Source chain column -->
  <rect x="30" y="95" width="360" height="480" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="50" y="125" font-size="16" font-weight="700" fill="#0f172a">Source chain</text>
  <text x="50" y="145" font-size="12" fill="#64748b">Ethereum Sepolia (live) · Base Sepolia · Polygon Amoy</text>

  <rect x="60" y="165" width="300" height="52" rx="10" fill="#ffffff" stroke="#94a3b8"/>
  <text x="210" y="188" font-size="14" font-weight="600" fill="#0f172a" text-anchor="middle">User wallet</text>
  <text x="210" y="206" font-size="12" fill="#64748b" text-anchor="middle">one signature: send(intent, amount)</text>

  <rect x="60" y="245" width="300" height="130" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="210" y="270" font-size="15" font-weight="700" fill="#1e3a8a" text-anchor="middle">AndThenRouter</text>
  <text x="78" y="294" font-size="12.5" fill="#1e293b">1. optional swap to USDC (Uniswap v4)</text>
  <text x="78" y="316" font-size="12.5" fill="#1e293b">2. CCTP burn, hook data = intent hash</text>
  <text x="78" y="338" font-size="12.5" fill="#1e293b">3. CCIP message carrying the intent</text>
  <text x="78" y="360" font-size="11.5" fill="#64748b">0x29C7…a6c3f (Sepolia)</text>

  <rect x="60" y="410" width="300" height="72" rx="10" fill="#ffffff" stroke="#94a3b8"/>
  <text x="210" y="435" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">InvoiceBook</text>
  <text x="210" y="456" font-size="12.5" fill="#1e293b" text-anchor="middle">pay link unlocks when the receipt lands</text>
  <text x="210" y="474" font-size="11.5" fill="#64748b" text-anchor="middle">0x1e1d…47BB (Sepolia)</text>

  <rect x="60" y="505" width="300" height="52" rx="10" fill="#fff7ed" stroke="#c2410c"/>
  <text x="210" y="528" font-size="14" font-weight="600" fill="#7c2d12" text-anchor="middle">EURC · WETH · cirBTC in wallet</text>
  <text x="210" y="546" font-size="12" fill="#9a3412" text-anchor="middle">non-USDC assets</text>

  <path d="M210 217 L210 243" stroke="#334155" stroke-width="1.8" fill="none" marker-end="url(#a)"/>

  <!-- Middle: rails -->
  <text x="600" y="125" font-size="16" font-weight="700" fill="#0f172a" text-anchor="middle">Rails</text>

  <path d="M362 300 L818 300" stroke="#2563eb" stroke-width="2.2" fill="none" marker-end="url(#ab)"/>
  <rect x="470" y="276" width="240" height="22" rx="11" fill="#dbeafe"/>
  <text x="590" y="292" font-size="12.5" font-weight="600" fill="#1e40af" text-anchor="middle">Circle CCTP v2: USDC + hook</text>

  <path d="M362 338 L818 338" stroke="#7c3aed" stroke-width="2.2" fill="none" stroke-dasharray="7 5" marker-end="url(#ap)"/>
  <rect x="470" y="344" width="240" height="22" rx="11" fill="#ede9fe"/>
  <text x="590" y="360" font-size="12.5" font-weight="600" fill="#5b21b6" text-anchor="middle">Chainlink CCIP: intent</text>

  <path d="M818 446 L362 446" stroke="#7c3aed" stroke-width="2.2" fill="none" stroke-dasharray="7 5" marker-end="url(#ap)"/>
  <rect x="460" y="452" width="260" height="22" rx="11" fill="#ede9fe"/>
  <text x="590" y="468" font-size="12.5" font-weight="600" fill="#5b21b6" text-anchor="middle">CCIP receipt (fee in native USDC)</text>

  <path d="M362 531 L790 531 L790 684 L826 684" stroke="#c2410c" stroke-width="2.2" fill="none" marker-end="url(#ao)"/>
  <rect x="455" y="503" width="270" height="22" rx="11" fill="#ffedd5"/>
  <text x="590" y="519" font-size="12.5" font-weight="600" fill="#9a3412" text-anchor="middle">Circle Bridge Kit (CCTP non-USDC)</text>

  <!-- Arc column -->
  <rect x="810" y="95" width="360" height="660" rx="14" fill="#f0fdf4" stroke="#86efac"/>
  <text x="830" y="125" font-size="16" font-weight="700" fill="#14532d">Arc Testnet</text>
  <text x="830" y="145" font-size="12" fill="#166534">USDC is gas · sub-second finality</text>

  <rect x="830" y="160" width="320" height="50" rx="10" fill="#ffffff" stroke="#16a34a" stroke-dasharray="5 4"/>
  <text x="990" y="182" font-size="13.5" font-weight="700" fill="#14532d" text-anchor="middle">Arc Studio</text>
  <text x="990" y="200" font-size="12" fill="#166534" text-anchor="middle">audited, compiled and deployed Settlement</text>
  <path d="M990 210 L990 238" stroke="#16a34a" stroke-width="1.8" fill="none" stroke-dasharray="4 3" marker-end="url(#a)"/>

  <rect x="830" y="240" width="320" height="225" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="990" y="266" font-size="15" font-weight="700" fill="#14532d" text-anchor="middle">AndThenSettlement</text>
  <text x="848" y="292" font-size="12.5" fill="#1e293b">receiveFunds: mint USDC (relayer)</text>
  <text x="848" y="314" font-size="12.5" fill="#1e293b">ccipReceive: store the intent</text>
  <text x="848" y="336" font-size="12.5" fill="#1e293b">both arrived → run the action</text>
  <text x="848" y="358" font-size="12.5" fill="#1e293b">emit Settled, CCIP receipt back</text>
  <text x="848" y="380" font-size="12.5" fill="#1e293b">price bounds, deadlines, refunds</text>
  <text x="848" y="402" font-size="12.5" fill="#1e293b">intent hash keys the order</text>
  <text x="848" y="440" font-size="11.5" fill="#64748b">0xddc5…8bb3</text>

  <!-- actions -->
  <text x="830" y="500" font-size="13" font-weight="700" fill="#14532d">"and then" on Arc</text>
  <rect x="830" y="512" width="150" height="46" rx="9" fill="#ffffff" stroke="#94a3b8"/>
  <text x="905" y="532" font-size="12.5" font-weight="600" fill="#0f172a" text-anchor="middle">Pay</text>
  <text x="905" y="549" font-size="11" fill="#64748b" text-anchor="middle">exact USDC / EURC</text>
  <rect x="1000" y="512" width="150" height="46" rx="9" fill="#fdf2f8" stroke="#db2777"/>
  <text x="1075" y="532" font-size="12.5" font-weight="600" fill="#9d174d" text-anchor="middle">Uniswap v4</text>
  <text x="1075" y="549" font-size="11" fill="#9d174d" text-anchor="middle">USDC/EURC swap · LP</text>
  <rect x="830" y="568" width="150" height="46" rx="9" fill="#eef2ff" stroke="#4f46e5"/>
  <text x="905" y="588" font-size="12.5" font-weight="600" fill="#3730a3" text-anchor="middle">Morpho</text>
  <text x="905" y="605" font-size="11" fill="#3730a3" text-anchor="middle">USDC vault · loop</text>
  <rect x="1000" y="568" width="150" height="46" rx="9" fill="#ffffff" stroke="#94a3b8"/>
  <text x="1075" y="588" font-size="12.5" font-weight="600" fill="#0f172a" text-anchor="middle">Hold</text>
  <text x="1075" y="605" font-size="11" fill="#64748b" text-anchor="middle">USDC / EURC on Arc</text>
  <path d="M990 465 L990 486" stroke="#334155" stroke-width="1.8" fill="none" marker-end="url(#a)"/>

  <rect x="830" y="632" width="320" height="104" rx="10" fill="#fff7ed" stroke="#c2410c"/>
  <text x="990" y="656" font-size="14" font-weight="700" fill="#7c2d12" text-anchor="middle">User wallet on Arc</text>
  <text x="848" y="680" font-size="12.5" fill="#1e293b">asset minted by Bridge Kit</text>
  <text x="848" y="702" font-size="12.5" fill="#1e293b">Circle Swap / App Kit → same actions</text>
  <text x="848" y="724" font-size="11.5" fill="#64748b">payments tagged through Arc's Memo</text>

  <!-- legend -->
  <rect x="30" y="600" width="740" height="155" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="50" y="628" font-size="14" font-weight="700" fill="#0f172a">Two routes</text>
  <line x1="50" y1="652" x2="90" y2="652" stroke="#2563eb" stroke-width="2.4"/>
  <text x="100" y="657" font-size="12.5" fill="#1e293b"><tspan font-weight="700">Router route</tspan>: USDC from a chain with a CCIP lane. One signature on the source chain, Settlement finishes on Arc.</text>
  <line x1="50" y1="680" x2="90" y2="680" stroke="#c2410c" stroke-width="2.4"/>
  <text x="100" y="685" font-size="12.5" fill="#1e293b"><tspan font-weight="700">Bridge Kit route</tspan>: EURC, WETH, cirBTC and USDC from other chains, finished from the wallet on Arc.</text>
  <line x1="50" y1="708" x2="90" y2="708" stroke="#7c3aed" stroke-width="2.4" stroke-dasharray="7 5"/>
  <text x="100" y="713" font-size="12.5" fill="#1e293b">CCIP carries instructions and receipts only. All value moves through CCTP.</text>
  <text x="50" y="740" font-size="11.5" fill="#64748b">Proven on testnet: EURC hook into an Arc contract (~16 min standard), CCIP Arc → Sepolia (17 s), v4 swap on Arc (1 USDC → 0.851 EURC).</text>
</svg>
